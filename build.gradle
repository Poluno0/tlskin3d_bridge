plugins {
    id 'java'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'dev.skinbridge'

base {
    archivesName = 'tlskin3dbridge-1.20.1-forge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            mods {
                tlskin3dbridge {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    // Только аннотации Mixin для компиляции (в игре Mixin уже есть в Forge).
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

tasks.named('jar', Jar).configure {
    // Заглушка интерфейса Skin Layers нужна только для компиляции, в мод её класть нельзя.
    exclude 'dev/tr7zw/**'
    manifest {
        attributes([
                'Specification-Title'   : 'tlskin3dbridge',
                'Specification-Vendor'  : 'skinbridge',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : 'skinbridge',
                'MixinConfigs'          : 'tlskin3dbridge.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
